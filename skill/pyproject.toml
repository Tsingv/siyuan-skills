[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siyuan-skill"
version = "0.1.0"
description = "Portable SiYuan skill for interacting with a local SiYuan instance via Python"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
  "pandas>=2.2.0",
  "tabulate>=0.9.0",
]
